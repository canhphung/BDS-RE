name: native-builds
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        mode: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBDS_SANITIZE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  windows:
    # Keep the runner aligned with the Visual Studio 17 2022 CMake preset.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows-msvc
      - run: cmake --build build/windows-msvc --config ${{ matrix.mode }} --parallel 2
      - run: ctest --test-dir build/windows-msvc -C ${{ matrix.mode }} --output-on-failure
